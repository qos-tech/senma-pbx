;
; RTP Configuration
;
[general]
;
; RTP start and RTP end configure start and end addresses
;
; Defaults are rtpstart=5000 and rtpend=31000
;
; TASK-0034B: narrowed from 10000-20000 (10001 ports) to 10000-10199
; (200 ports -- up to ~100 simultaneous calls at 2 ports/call). The
; wider range was never a problem for development (every dev/regression
; call happens over the internal Docker network directly, never through
; a host-published port), but publishing that many individual host
; ports for a real pilot deployment (compose.pilot.yaml) was confirmed
; live to make Docker's own port-publishing step hang and exhaust host
; memory (one per-port forwarding process each) -- see
; docs/tasks/0034b-production-network-exposure-hardening.md. 200 ports
; is a generous starting point for a first controlled pilot; widen both
; this file and compose.pilot.yaml's matching range together if a
; pilot's real concurrent-call volume requires more, keeping the two in
; sync (a mismatch would silently break audio for negotiated RTP ports
; outside the published range).
rtpstart=10000
rtpend=10199
;
; Whether to enable or disable UDP checksums on RTP traffic
;
;rtpchecksums=no
;
; The amount of time a DTMF digit with no 'end' marker should be
; allowed to continue (in 'samples', 1/8000 of a second)
;
;dtmftimeout=3000
; rtcpinterval = 5000 	; Milliseconds between rtcp reports 
			;(min 500, max 60000, default 5000)

;icesupport=yes
;stunaddr=stun.l.google.com:19302
