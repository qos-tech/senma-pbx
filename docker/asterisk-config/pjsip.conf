; pjsip.conf -- TASK-0009 DEVELOPMENT/BOOTSTRAP CONFIGURATION ONLY.
;
; This file exists ONLY to validate TASK-0009's runtime: proving one real
; call through the existing SENMA dialplan/AGI/rule engine using PJSIP
; channel technology (PJSIP/1000 -> PJSIP/1001). It hardcodes exactly two
; static test extensions and one transport.
;
; It is NOT the SENMA PJSIP provisioning architecture. Production
; provisioning (peers-table-driven config generation, replacing/extending
; Snep_InterfaceConf's current chan_sip output) is a separate, future
; milestone -- this file WILL be replaced or removed when that lands. Do
; not add trunks, inbound routes, additional endpoints, or a realtime
; backend here. See docs/tasks/0009-first-pjsip-call.md.
;
; Passwords are templated by docker/asterisk-entrypoint.sh from
; PJSIP_TEST_1000_SECRET / PJSIP_TEST_1001_SECRET (.env) -- not committed
; secrets.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1000]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
auth=1000-auth
; aors MUST equal the AOR's own sorcery object name below ("1000"), not an
; arbitrary label -- res_pjsip_registrar looks up the AOR by matching the
; REGISTER request's URI username directly against an AOR object name
; (confirmed empirically: naming it "1000-aor" produced a real, reproduced
; "AOR '' not found for endpoint '1000'" / 404 from a live baresip
; registration attempt during TASK-0009 validation).
aors=1000
callerid=1000 <1000>
direct_media=no

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=__PJSIP_1000_SECRET__

[1000]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0

[1001]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
callerid=1001 <1001>
direct_media=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=__PJSIP_1001_SECRET__

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0
