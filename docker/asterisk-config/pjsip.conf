; pjsip.conf -- static, project-owned PJSIP configuration (TASK-0011).
;
; Holds only what SENMA-generated provisioning must NOT own: the
; transport(s) and any future global PJSIP settings. Every actual
; extension is generated by Snep_PjsipConf::loadConfFromDb() into
; snep/senma-pjsip.conf and included below -- this file is never
; regenerated by the application and never contains a real endpoint.
; See docs/tasks/0010-pjsip-extension-provisioning-architecture.md §5
; and docs/tasks/0011-pjsip-extension-provisioning.md.
;
; TASK-0009 note: this file used to also hardcode two static bootstrap
; test endpoints (1000/1001) to prove the very first real PJSIP call
; before SENMA-side provisioning existed. Removed here now that
; Snep_PjsipConf provisions real extensions end to end -- production
; provisioning must not depend on anything defined in this static file.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

#include snep/senma-pjsip.conf
; TASK-0015: SENMA-generated PJSIP trunk provisioning
; (Snep_PjsipTrunkConf::loadConfFromDb()) -- a separate generated file
; from senma-pjsip.conf above, per docs/tasks/0014-pjsip-trunk-provisioning-architecture.md
; §9/§11 (extensions and trunks have materially different object counts/
; lifecycle, so a dedicated generator writes its own file rather than
; sharing one with Snep_PjsipConf).
#include snep/senma-pjsip-trunks.conf
