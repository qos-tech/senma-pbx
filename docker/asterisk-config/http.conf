; http.conf -- static, project-owned Asterisk built-in HTTP/WebSocket
; server configuration (TASK-0028Z, TLS ownership moved to TASK-0029A).
;
; Before TASK-0028Z, /etc/asterisk/http.conf was entirely absent and
; Asterisk's built-in HTTP server defaulted to fully disabled
; ("asterisk -rx 'http show status'" => "Server Disabled"). The product's
; pjsip_transports "wss" row rides on top of this same server via
; res_http_websocket.so/res_pjsip_transport_websocket.so. See
; docs/tasks/0028z-wss-asterisk-http-enablement.md.
;
; TERMINATION MODEL (TASK-0028Z): TLS terminates directly in Asterisk. No
; reverse proxy exists anywhere in this project's Docker topology.
;
; TASK-0029A: the actual TLS settings below (tlsenable/tlsbindaddr/
; tlscertfile/tlsprivatekey/...) moved out of this static file into
; snep/senma-http-tls.conf, a GENERATED file
; (Snep_PjsipTransportConf::writeHttpTlsConf()) sourced from whichever
; single enabled ws/wss pjsip_transports row currently carries
; certificate material -- the same certificate-reference mechanism a
; production admin configures through the SENMA UI, not a second
; hardcoded path. See docs/tasks/0029a-tls-transport-certificate-management.md.

[general]
enabled=yes
; Asterisk's [general] enabled switch is the single master switch for
; the whole built-in HTTP server -- it cannot turn on the TLS/WSS
; listener without also activating this plain listener, but nothing in
; the current product exposes or needs a plain "ws" transport externally
; (only "wss" is seeded/supported; see pjsip_transports). Bound to
; loopback-only rather than left at Asterisk's own 0.0.0.0 default, so
; it is reachable from nowhere outside this container.
bindaddr=127.0.0.1
bindport=8088

#include snep/senma-http-tls.conf
