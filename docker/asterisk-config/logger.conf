; logger.conf -- TASK-0005 / TASK-0035E3 Docker runtime logging contract.
;
; Adapted from snep/install/etc/asterisk/logger.conf (stock Asterisk
; sample lineage). Project-owned: docker/asterisk-entrypoint.sh
; reconciles this file onto the asterisk-etc volume every start so
; existing volumes pick up the console channel without a manual
; /etc/asterisk edit.
;
; Contract (TASK-0035E3):
;   * console  — interactive CLI (`asterisk -rvvv`) + foreground
;                process stdout (docker compose logs -f asterisk)
;   * full     — persistent file under /var/log/asterisk/full
;
; Both channels ALLOW notice/warning/error/verbose/debug. Declaring
; `debug` here does NOT emit high-volume DEBUG by itself; operators
; must opt in at runtime (`core set debug N`, `pjsip set logger on`,
; `rtp set debug on`). Normal startup stays quiet aside from the
; process's own -vvv verbose floor.

[general]

[logfiles]
console => notice,warning,error,verbose,debug
full => notice,warning,error,verbose,debug
