; asterisk.conf -- TASK-0005 minimal Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/asterisk.conf (SNEP 3.07 /
; Asterisk 13 legacy install). Differences from the legacy file:
;   - astmoddir: legacy used the stale, non-multiarch "/usr/lib64/asterisk/
;     modules" path. This container installs to the standard "/usr/lib/
;     asterisk/modules" path (see docker/asterisk.Dockerfile's `make
;     install`), not a distro-multiarch path, since the build stage
;     controls the install prefix directly.
;   - runuser/rungroup: the legacy file left these commented out, so
;     Asterisk ran as root. Not replicated here -- the container's own
;     Dockerfile already runs the process as the dedicated non-root
;     `asterisk` user via `USER asterisk`, so runuser/rungroup are left
;     unset (redundant, not wrong, to set them again for a process that
;     cannot elevate past its container UID anyway).
; See docs/tasks/0005-asterisk-container-bootstrap.md.

; TASK-0009: was "[directories](!)", inherited verbatim from the vendored
; snep/install/etc/asterisk/asterisk.conf. (!) marks a category as a
; template in Asterisk's config parser -- templates are excluded from
; normal category lookups (ast_variable_browse(cfg, "directories") finds
; nothing) unless something else explicitly inherits from them, which
; nothing here did. This made every value in this section a silent no-op;
; it went unnoticed since astetcdir/astmoddir/astvarlibdir/etc. all
; happened to match Asterisk's own compiled-in FHS defaults. astagidir's
; compiled-in default (/var/lib/asterisk/agi-bin, always empty) does NOT
; match what this task needs, which is what surfaced the bug: a live call
; failed with "Failed to execute '/var/lib/asterisk/agi-bin/snep/snep.php':
; File does not exist" even though this file on disk already said
; /var/www/html/snep/agi -- `core show settings` confirmed the running
; process was still using the compiled-in default, not this file's value.
; See docs/tasks/0009-first-pjsip-call.md.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
; TASK-0009: left at the default /var/lib/asterisk/agi-bin -- NOT
; repointed directly at /var/www/html/snep/agi. The dialplan calls AGI
; scripts as "snep/snep.php" etc. (a "snep/" prefix baked into
; extensions.conf/snep-features.conf), so Asterisk resolves
; "<astagidir>/snep/snep.php". Repointing astagidir itself at .../snep/agi
; produced a real double "snep/agi/snep/snep.php" File-does-not-exist
; failure during validation. Instead, asterisk-entrypoint.sh creates
; astagidir/snep as a symlink to the real /var/www/html/snep/agi tree --
; this is the same "symlink farm" pattern TASK-0001/0008 already found in
; the legacy (non-Docker) install, not a new invention. See
; docs/tasks/0009-first-pjsip-call.md.
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
