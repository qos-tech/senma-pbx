; asterisk.conf -- TASK-0015 local development "provider" simulator.
;
; A second, independent Asterisk 22 instance acting as a deterministic
; stand-in for a real SIP trunk provider, so TASK-0015 can prove a real
; outbound INVITE/REGISTER dialog without any commercial carrier
; credentials. This container never runs SENMA's own PHP/AGI/ODBC stack --
; it is plain Asterisk with a minimal PJSIP account and a dialplan that
; answers and hangs up. See docs/tasks/0015-pjsip-trunk-provisioning.md.
;
; Deliberately NOT the same file as docker/asterisk-config/asterisk.conf:
; astagidir/ODBC/CDR paths are irrelevant here and are simply omitted
; rather than pointed at unused locations.

[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
