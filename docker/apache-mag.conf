# TASK-0035A / TASK-0035E2: Apache is the application HTTP frontend and
# the reverse-proxy hop for Asterisk WebSocket signaling.
#
# TASK-0035E2: `/asterisk/ws` is proxied on the HTTP vhost so an external
# TLS terminator (e.g. Nginx Proxy Manager) can reach:
#   client --TLS--> NPM :443
#        --HTTP--> SENMA :8080 /asterisk/ws
#        --WS----> 127.0.0.1:8088/ws  (host mode)
#        --WS----> asterisk:8088/ws   (bridge / make-dev default)
#
# Placeholders rewritten every container start by docker/entrypoint.sh:
#   __APACHE_HTTP_PORT__   default 80 (bridge) / 8080 (host)
#   __ASTERISK_WS_BACKEND__ default ws://asterisk:8088/ws
#
# Optional HTTPS vhost remains for SENMA-owned TLS termination
# (TLS_TERMINATION_MODE=senma / transitional). External mode does not
# require it for public WSS.
#
# Listen directives live in ports.conf (rewritten by entrypoint). Do not
# add Listen here — that races the image default Listen 80.

<VirtualHost *:__APACHE_HTTP_PORT__>
    ServerName localhost
    DocumentRoot /var/www/html/snep

    <Directory /var/www/html/snep>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ProxyTimeout 86400
    ProxyPreserveHost On

    # Public WebSocket signaling path (HTTP backend). Required for
    # external TLS termination (closes TASK-0035 I6).
    ProxyPass        /asterisk/ws __ASTERISK_WS_BACKEND__ retry=0 timeout=86400
    ProxyPassReverse /asterisk/ws __ASTERISK_WS_BACKEND__

    # TASK-0033D: ErrorLog is piped through `tee` so PHP/Apache fatal
    # errors reach BOTH the historical file path (13 existing security/
    # regression smoke test scripts read specific byte/line windows of
    # this exact file for known-signature detection -- migrating all of
    # them is tracked as follow-up debt, not done here) AND the
    # container's own stdout, which `docker compose logs app` (TASK-
    # 0033's own headline finding: it showed ZERO of 50,000+ real PHP
    # Fatal Error lines that existed only in this file) now surfaces
    # live. mag-error.log's growth is bounded by docker/log-rotate.sh
    # (copytruncate-style, no signal needed since `tee` holds the file
    # open continuously). CustomLog has no such legacy file dependency
    # (grepped scripts/*.sh -- zero references) and goes straight to
    # stdout, matching the base image's own default-vhost convention
    # (docker/entrypoint.sh's own `ls -la /var/log/apache2/` shows
    # access.log/error.log already symlinked to /dev/stdout//dev/stderr
    # there -- this vhost is the one exception, now closed for errors
    # and fully closed for access).
    ErrorLog "|/usr/bin/tee -a ${APACHE_LOG_DIR}/mag-error.log"
    CustomLog /dev/stdout combined
</VirtualHost>

# TASK-0035A — optional SENMA-owned HTTPS + WSS reverse-proxy vhost.
# Certificate/key paths are populated by docker/entrypoint.sh (dev fixture
# or operator-mounted PUBLIC_WSS_* paths). Used when
# TLS_TERMINATION_MODE is not `external`, or as a transitional listener.
# Public WSS URL shape (SENMA-owned TLS):
#   wss://<public-host>:<https-port>/asterisk/ws
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/snep

    <Directory /var/www/html/snep>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/senma/certs/public-wss.crt
    SSLCertificateKeyFile /etc/senma/certs/public-wss.key
    # Prefer modern TLS for browser/WebPhone clients.
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!RC4

    # Long-lived SIP-over-WebSocket sessions must not be cut by short
    # proxy timeouts; disable request buffering for the upgrade path.
    ProxyTimeout 86400
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Exact public path (SENMA-owned). Forward to Asterisk's /ws URI.
    # mod_proxy_wstunnel handles the HTTP Upgrade / Connection: Upgrade
    # WebSocket handshake; a plain HTTPS 200 is NOT proof of WSS.
    ProxyPass        /asterisk/ws __ASTERISK_WS_BACKEND__ retry=0 timeout=86400
    ProxyPassReverse /asterisk/ws __ASTERISK_WS_BACKEND__

    # Refuse open-proxy behaviour: only the explicit Asterisk WS path
    # above is proxied. No generic ProxyPass / to an arbitrary backend.

    ErrorLog "|/usr/bin/tee -a ${APACHE_LOG_DIR}/mag-error.log"
    CustomLog /dev/stdout combined
</VirtualHost>
</IfModule>
