# TASK-0034C — base Compose contract (Finding CH-3 closure).
#
# This file is the PRODUCTION-SAFE BASE: with no `-f compose.pilot.yaml`
# overlay and no `dev`/`test` Compose profile activated, it starts
# exactly `app`, `asterisk`, `db` -- never a development/test-only
# fixture -- and publishes nothing beyond the app's own HTTP port. That
# is true for a plain `docker compose up`, not just for this repo's own
# Makefile wrapper, so the guarantee holds even for an operator who
# bypasses `make` entirely.
#
# The `provider` service below (TASK-0015, a SIP-trunk simulator for
# local development/regression only) carries `profiles: [dev, test]` --
# Compose only starts a profiled service when one of its listed
# profiles is explicitly activated (`COMPOSE_PROFILES=dev|test`, or
# `--profile dev|test`). No plain `up`, `restart`, or `--force-recreate`
# activates a profile on its own. See the Makefile's own `FIXTURE_PROFILE`
# variable for this repository's single supported opt-in mechanism, and
# `docs/tasks/0034c-production-fixture-compose-profile-isolation.md` for
# the full evidence trail (fixture inventory, why `dev`+`test` rather
# than one name, and the pilot/regression interaction proof).
#
# TASK-0033D: every service otherwise inherits Docker's default json-file
# driver with NO size/file cap (confirmed live: `docker inspect
# .HostConfig.LogConfig` showed `{"Type":"json-file","Config":{}}` on
# every container before this task) -- an unbounded risk now that Apache's
# error/access logs and Asterisk's own stdout both flow through it (see
# docker/apache-mag.conf, TASK-0033D LOG VISIBILITY). 10m x 5 files (50 MiB
# per container) is a conservative bound: generous enough to keep several
# hours of even verbose troubleshooting output available via `docker
# compose logs`, small enough that four containers can never together
# threaten host disk space the way the pre-existing unbounded Asterisk
# `full` file did (confirmed live at 284-297 MiB with zero rotation).
x-logging: &senma-default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    # TASK-0034D: explicit, version-derived image name/tag (TASK-0034
    # CH-9) instead of Compose's own project-name-derived default.
    # RELEASE_VERSION defaults to "dev" (DEVELOPMENT_ONLY, mutable) for
    # every plain `make up`/`make dev` -- a pilot/production build
    # overrides it via `make release-build VERSION=vX.Y.Z` (see the
    # Makefile's own RELEASE_VERSION/GIT_COMMIT/BUILD_TIMESTAMP export
    # and docs/tasks/0034d-release-artifact-versioning-image-provenance.md).
    image: senma-app:${RELEASE_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    env_file:
      - .env
    ports:
      - "${MAG_HTTP_PORT:-8080}:80"
      # TASK-0035A: public HTTPS/WSS (TLS terminates in Apache; Asterisk
      # receives private WS on the Docker network). Default 8443 avoids
      # requiring privileged bind of host :443 in local development.
      - "${MAG_HTTPS_PORT:-8443}:443"
    volumes:
      - ./snep:/var/www/html/snep
      # TASK-0009: was :ro. Snep_InterfaceConf (future work, not invoked by
      # this task) will eventually need to write generated dialplan config
      # here; the actual write-protection now comes from filesystem
      # permissions (only /etc/asterisk/snep is group-writable via the
      # shared senma-config group), not the Docker mount flag. See
      # docker/asterisk-entrypoint.sh and docs/tasks/0009-first-pjsip-call.md.
      - asterisk-etc:/etc/asterisk
      # TASK-0034I: same named volume the `asterisk` service already mounts
      # at this exact path -- NOT a second/competing persistence model.
      # Snep_SoundFiles_Manager (MusicOnHoldController/SoundFilesController)
      # reads/writes $config->system->path->asterisk->{moh,sounds}
      # (/var/lib/asterisk/{moh,sounds}) directly from PHP running in THIS
      # container; before this task the app container had no visibility
      # into /var/lib/asterisk at all (confirmed live: `ls /var/lib/asterisk`
      # failed with ENOENT), which is the actual root cause of the System
      # Status "moh directory missing" report -- the directory is checked
      # from a container that structurally cannot see it, independent of
      # whether it exists on the Asterisk side. Write access is gated by
      # Unix permissions (senma-config group, see asterisk-entrypoint.sh),
      # not by the mount flag, matching the asterisk-etc precedent above.
      - mag-asterisk-var:/var/lib/asterisk
      # TASK-0035E9: operator-local bootstrap secret directory. Host path
      # ./secrets (gitignored contents) is the only place the initial
      # admin plaintext may exist. Not in webroot, not in the image,
      # not in ordinary backups. See docker/bootstrap-admin.php and
      # docs/tasks/0035e9-secure-initial-admin-credential-bootstrap.md.
      - ./secrets:/run/senma/secrets
    depends_on:
      db:
        condition: service_healthy
      # TASK-0035E8: deliberately NOT waiting on asterisk. App entrypoint
      # initializes the shared recording directory (./snep/arquivos) as
      # root before Asterisk starts; asterisk depends_on app
      # service_started for that ordering. App still degrades gracefully
      # when AMI is unavailable (TASK-0029B / TASK-0033E).
    healthcheck:
      # TASK-0033E: replaces a bare `curl -f http://localhost/` (proved
      # only that Apache answers a socket, not that PHP bootstrapped or
      # reached the database -- see docker/healthcheck-app.sh's own
      # header and docs/tasks/0033e-readiness-contract-hardening.md
      # APPLICATION READINESS CONTRACT).
      test: ["CMD", "bash", "/usr/local/bin/healthcheck-app.sh"]
      interval: 10s
      timeout: 5s
      # TASK-0033E: retries lowered 10 -> 6 (100s -> 60s grace before
      # Docker reports unhealthy). The pre-existing value dates from
      # when this check was a bare socket ping, tolerant of almost
      # anything; now that it verifies actual PHP/DB capability, a
      # genuine failure is not a transient blip that fixes itself in a
      # few seconds, so slow detection no longer buys real stability --
      # it only delays the operator finding out. start_period is
      # unchanged (15s comfortably covers this project's own measured
      # fresh-install convergence, ~13-14s for the whole stack -- see
      # docs/tasks/0033e-readiness-contract-hardening.md TIMEOUT/RETRY
      # MODEL).
      retries: 6
      start_period: 15s
    networks:
      - mag
      # TASK-0034F (closing TASK-0034 CH-6): `app` also joins the
      # dedicated `senma-control` network -- see that network's own
      # definition below for the full rationale. `app` needs no alias
      # here (nothing resolves TO app over this network; it is only ever
      # the client, reaching OUT to asterisk's `senma-ami` alias).
      - senma-control
    restart: unless-stopped
    logging: *senma-default-logging

  asterisk:
    # TASK-0034D: see the `app` service's identical comment above -- same
    # RELEASE_VERSION contract, kept in agreement with `app` by
    # `make release-build` (both built from one invocation, one version).
    image: senma-asterisk:${RELEASE_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/asterisk.Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    env_file:
      - .env
    volumes:
      - asterisk-etc:/etc/asterisk
      - mag-asterisk-var:/var/lib/asterisk
      - mag-asterisk-spool:/var/spool/asterisk
      - mag-asterisk-log:/var/log/asterisk
      - ./docker/asterisk-config:/asterisk-config-src:ro
      - ./snep/install/etc/asterisk/snep:/snep-asterisk-config-src:ro
      # TASK-0009: extensions.conf + custom/{preagi,posagi,eof}.conf --
      # the vendored dialplan itself was never deployed into the container
      # before this task (only its snep/snep-*.conf includes were). See
      # docker/asterisk-entrypoint.sh.
      - ./snep/install/etc/asterisk:/snep-asterisk-dialplan-src:ro
      # TASK-0034I: the vendored, GPL-inherited Asterisk core-sound WAV
      # packages (part of the original SNEP 3.07 import, snep/install/
      # sounds/*.tar.gz) -- IMAGE_IMMUTABLE/SYSTEM_PROVIDED content, not
      # customer data. Bind-mounted read-only, same "vendored source of
      # truth, never copied into the image" pattern as
      # snep-asterisk-config-src/snep-asterisk-dialplan-src above, rather
      # than a Dockerfile COPY -- keeps the build context narrowing this
      # repo already relies on (see .dockerignore's own TASK-0034D note)
      # intact. asterisk-entrypoint.sh extracts these into the
      # mag-asterisk-var volume on first boot only (see SOUNDS SEEDING
      # there) -- Asterisk's own dialplan (snep-features.conf) calls
      # Playback() of several named prompts (beep, do-not-disturb,
      # activated, de-activated) that silently resolve to nothing without
      # this content; live evidence: /var/lib/asterisk/sounds did not
      # exist at all before this task.
      - ./snep/install/sounds:/snep-sounds-src:ro
      # TASK-0009: the SENMA AGI entrypoints, bind-mounted (not copied into
      # the image) at the SAME absolute path the app container already
      # uses -- several config values (voicemail.conf's externnotify,
      # setup.conf's path_voz) hardcode /var/www/html/snep. astagidir in
      # asterisk.conf points at /var/www/html/snep/agi. Read-only: this
      # container executes AGI scripts, it does not author them.
      - ./snep:/var/www/html/snep:ro
      # TASK-0035E8: shared call-recording store. Host canonical path is
      # ./snep/arquivos (single persistent recording directory; already
      # covered by backup/restore). Mapped to Asterisk's monitor spool so
      # MixMonitor writes land on the same host files the app serves via
      # path_voz. The second mount overrides the :ro ./snep tree for the
      # recording subtree only -- AGI still resolves path_voz under
      # /var/www/html/snep/arquivos, and both views share one inode.
      - ./snep/arquivos:/var/spool/asterisk/monitor
      - ./snep/arquivos:/var/www/html/snep/arquivos
    # AMI (5038) is container-to-container only -- no host port published,
    # per TASK-0005's explicit instruction.
    depends_on:
      db:
        condition: service_healthy
        # TASK-0033E: added after live evidence, NOT part of the original
        # design. Asterisk has no HARD runtime dependency on the database
        # (ODBC is classified DEGRADED, deliberately excluded from
        # healthcheck-asterisk.sh -- see ASTERISK READINESS CONTRACT), but
        # `res_odbc.so` performs its ONE initial connection attempt during
        # Asterisk's own module-load sequence and does NOT auto-reconnect
        # afterward (same non-auto-reconnect behavior documented elsewhere
        # in this task for destructive db-restart scenarios). With no
        # ordering gate at all, `asterisk` and `db` start in parallel, and
        # 3/3 live simultaneous-cold-start trials reproduced Asterisk
        # winning that race and ending up with "Number of active
        # connections: 0" permanently -- silently breaking every CDR write
        # from first boot onward, with nothing surfacing it (ODBC is
        # excluded from the healthcheck by design; the call itself
        # completes normally). Gating on `db` service_healthy (proven live
        # to fully avoid the race across repeated trials) costs only the
        # few seconds db already needs to report healthy on a normal boot
        # -- it does not change the DEGRADED-not-NOT_READY classification
        # of ODBC at runtime, it only removes a bad *initial* connection
        # attempt at Asterisk startup.
      # TASK-0035E8: app entrypoint (root) initializes ./snep/arquivos
      # ownership/mode before Asterisk must write recordings. service_started
      # only -- not healthy -- so a slow app healthcheck cannot block
      # Asterisk; recording-dir init runs early in docker/entrypoint.sh.
      app:
        condition: service_started
    healthcheck:
      # TASK-0033E: replaces `asterisk -rx "core show version"` alone --
      # TASK-0028V proved live that the CLI answers before res_pjsip.so
      # finishes loading, so that alone is not proof this container can
      # do anything SENMA actually needs. See docker/
      # healthcheck-asterisk.sh's own header and docs/tasks/
      # 0033e-readiness-contract-hardening.md ASTERISK READINESS
      # CONTRACT / PJSIP READINESS for the full invariant and evidence.
      test: ["CMD", "bash", "/usr/local/bin/healthcheck-asterisk.sh"]
      interval: 10s
      timeout: 5s
      # TASK-0033E: retries lowered 10 -> 6 (same rationale as the app
      # service's own healthcheck above -- this now verifies real
      # capability, not a bare liveness ping, so a genuine failure
      # deserves faster operator-visible detection, not more tolerance).
      retries: 6
      start_period: 15s
    # TASK-0034F (closing TASK-0034 CH-6): map form (not the plain "-
    # mag" list form the other services still use) is required here
    # because `senma-control` carries a per-network alias -- Compose
    # does not allow mixing list and map entries under one `networks:`
    # key.
    networks:
      mag: {}
      # `senma-control` is a dedicated, `internal: true` (no external
      # routing) Docker network shared ONLY by `app` and `asterisk` --
      # see its own definition below. `manager.conf`'s AMI ACL
      # (docker/asterisk-config/manager.conf,
      # `permit=__AMI_ACL_SUBNET__`) is scoped to THIS network's own
      # pinned subnet, not `mag`'s -- `db` and `provider` remain on
      # `mag` only, so their addresses fall outside the permitted range
      # and cannot authenticate to AMI even though they can still
      # complete a plain TCP connection to `asterisk`'s `mag`-facing
      # address (manager.conf's own `bindaddr = 0.0.0.0` binds every
      # interface -- see PHASE 12/BIND-ADDRESS SCOPE in docs/tasks/
      # 0034f-production-ami-acl-scoping.md for why this remains correct
      # when combined with the narrowed ACL and no host publication).
      # The explicit `senma-ami` alias (not the bare `asterisk` service
      # name, which remains valid but ambiguous once this container is
      # on two networks) is what `ASTERISK_HOST` now points at -- see
      # .env.example.
      senma-control:
        aliases:
          - senma-ami
    restart: unless-stopped
    logging: *senma-default-logging

  # TASK-0015: a second, independent Asterisk 22/PJSIP instance acting as
  # a deterministic local development trunk provider, so outbound PJSIP
  # trunk provisioning can be proven with a real SIP dialog without any
  # commercial carrier credentials. Reuses the same asterisk.Dockerfile
  # image (already PJSIP-capable, TASK-0009) with a different, much
  # smaller entrypoint/config (docker/provider-entrypoint.sh,
  # docker/provider-config/) -- never runs SENMA's own PHP/AGI/ODBC
  # stack. Own volumes, own network identity ("provider"), no host port
  # published (only the "asterisk" service needs to reach it, over the
  # internal "mag" network). See docs/tasks/0015-pjsip-trunk-provisioning.md.
  provider:
    # TASK-0034C: DEVELOPMENT_ONLY/TEST_ONLY fixture -- see the base-contract
    # header comment at the top of this file. `profiles: [dev, test]` means
    # this service is never created by a plain `docker compose up` (with or
    # without `--force-recreate`), never by `make up`/`make pilot-up`, and
    # never merely by naming it as a Compose dependency elsewhere -- it
    # requires `COMPOSE_PROFILES` to list `dev` or `test` at the moment
    # `up` runs. Two profile names, not one, because this repo's own
    # Makefile uses them to mean two different (if overlapping) callers:
    # `dev` = an interactive developer opted in via `make dev-up`; `test` =
    # a regression/smoke suite that owns this fixture's lifecycle for the
    # duration of its own run (`make trunk-smoke`, `make
    # pjsip-runtime-status-smoke`, `make readiness-smoke`, `make
    # regression`). Either profile starts the identical service -- the
    # split is about which caller and why, not different configurations.
    profiles:
      - dev
      - test
    build:
      context: .
      dockerfile: docker/asterisk.Dockerfile
    env_file:
      - .env
    entrypoint: ["/provider-entrypoint.sh"]
    command: ["asterisk", "-f", "-vvv"]
    volumes:
      - mag-provider-etc:/etc/asterisk
      - mag-provider-var:/var/lib/asterisk
      - ./docker/provider-entrypoint.sh:/provider-entrypoint.sh:ro
      - ./docker/provider-config:/provider-config-src:ro
    healthcheck:
      # TASK-0033E: `provider` is a TEST_ONLY trunk-simulator fixture
      # (TASK-0015), not core SENMA platform -- it does not get the
      # full dedicated healthcheck-asterisk.sh contract (no AMI is even
      # configured for it, and its one transport is static, not
      # DB-driven). It still closes the SAME TASK-0028V CLI-before-
      # PJSIP-ready race that affects any Asterisk instance, since
      # trunk-smoke tests dial through it immediately after it reports
      # healthy.
      test: ["CMD-SHELL", "asterisk -rx 'core show version' | grep -q Asterisk && asterisk -rx 'module show like res_pjsip.so' | grep -q Running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mag
    restart: unless-stopped
    logging: *senma-default-logging

  db:
    image: mariadb:10.11
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - mag-db:/var/lib/mysql
      - ./snep/install/database:/docker-entrypoint-initdb.d/snep-install:ro
      - ./snep/modules/billing/install:/docker-entrypoint-initdb.d/snep-billing:ro
      - ./docker/db-init/00-import-snep-schema.sh:/docker-entrypoint-initdb.d/00-import-snep-schema.sh:ro
      # TASK-0033F: runs lexically last -- see this file's own header for
      # why that ordering IS the bootstrap-completion invariant.
      - ./docker/db-init/99-bootstrap-marker.sh:/docker-entrypoint-initdb.d/99-bootstrap-marker.sh:ro
      # TASK-0033E: bind-mounted rather than baked into a custom image --
      # `db` deliberately stays on the stock `mariadb:10.11` image (no
      # Dockerfile), per CLAUDE.md's own preference for official images
      # where practical. See docker/healthcheck-db.sh's own header.
      - ./docker/healthcheck-db.sh:/usr/local/bin/healthcheck-db.sh:ro
    healthcheck:
      # TASK-0033E: replaces a bare root `mariadb-admin ping` (proved
      # only that the server accepts TCP connections, not that the
      # application credential works or the schema is imported -- see
      # docker/healthcheck-db.sh's own header and docs/tasks/
      # 0033e-readiness-contract-hardening.md DB READINESS CONTRACT).
      # Root-auth verification is preserved inside the script itself
      # (TASK-0033C's own secret-rotation fail-fast contract depends on
      # it).
      test: ["CMD", "bash", "/usr/local/bin/healthcheck-db.sh"]
      interval: 5s
      timeout: 3s
      # TASK-0033E: retries lowered 30 -> 10 (150s -> 50s grace).
      # Confirmed live: a genuinely broken schema (dropped core_config
      # table, simulating incomplete bootstrap) stays FAIL indefinitely
      # -- it is not a transient condition retries should be tuned to
      # absorb. 50s still comfortably tolerates a real transient
      # connection blip under write load (a database's own plausible
      # cause of brief flakiness, more so than app/asterisk), while
      # cutting operator-visible detection time by two-thirds. See
      # docs/tasks/0033e-readiness-contract-hardening.md TIMEOUT/RETRY
      # MODEL.
      retries: 10
      start_period: 20s
    networks:
      - mag
    restart: unless-stopped
    logging: *senma-default-logging

  # TASK-0035E10 — SIP abuse protection (Fail2ban). Fail-open for telephony:
  # Asterisk does NOT depend_on this service.
  #
  # HOST-MODE CONTRACT (pilot/production — mandatory, not optional):
  #   app + asterisk + db + senma-security all use network_mode: host
  #   (see compose.host.yaml / compose.pilot.yaml for app/asterisk/db).
  #   senma-security is host-mode in this base file so bans always land in
  #   the host netns that receives direct SIP 5060 under pilot topology.
  #   Bridge/dev may exercise filters + host iptables insertion, but that
  #   is NOT proof of public SIP firewall enforcement.
  #
  # Capabilities: NET_ADMIN only (proven sufficient for iptables-nft chain
  # create/jump/REJECT). NET_RAW removed — not required. No privileged,
  # no SYS_ADMIN, no docker.sock.
  senma-security:
    image: crazymax/fail2ban:1.1.1-debian@sha256:d4140e2848f98d600ea104cda982540b6420c164df5d559153e8e873d150e1f5
    network_mode: host
    cap_add:
      - NET_ADMIN
    # No NET_RAW, no SYS_ADMIN, no privileged, no docker.sock.
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-America/Sao_Paulo}"
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
      IPTABLES_MODE: auto
      SENMA_SECURITY_IGNOREIP: "${SENMA_SECURITY_IGNOREIP:-}"
      SENMA_SIP_PROVIDER_ALLOWLIST: "${SENMA_SIP_PROVIDER_ALLOWLIST:-}"
    volumes:
      - mag-asterisk-log:/var/log/asterisk:ro
      - ./docker/fail2ban:/senma-fail2ban-src:ro
      - senma-fail2ban-data:/data
    entrypoint: ["/senma-fail2ban-src/senma-fail2ban-entrypoint.sh"]
    command: ["fail2ban-server", "-f", "-x", "-v", "start"]
    # Lightweight: must not compete materially with Asterisk.
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "fail2ban-client ping 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *senma-default-logging

networks:
  mag:
    # TASK-0005: pinned explicitly (rather than left to Docker's
    # auto-allocated pool) for a stable, verified target -- an unpinned
    # network on this host was observed to come up as 172.18.0.0/16, not
    # Docker's default-bridge 172.17.0.0/16 the legacy manager.conf
    # assumed, confirming that value would have been wrong to reuse
    # here. Shared by every service (app/asterisk/db/provider) for
    # general connectivity -- HTTP publishing, DB access, ODBC,
    # trunk-simulator SIP. TASK-0034F: no longer the AMI ACL's own
    # target (see `senma-control` below) -- this network remains
    # deliberately BROAD, matching what it is actually used for.
    ipam:
      config:
        - subnet: 172.28.0.0/16

  # TASK-0034F (closing TASK-0034 CH-6): dedicated control-plane network
  # for the app<->asterisk AMI relationship only -- see docs/tasks/
  # 0034f-production-ami-acl-scoping.md for the full rationale (why
  # narrowing manager.conf's `permit=` CIDR alone cannot work: every
  # container on one shared bridge network draws from the SAME subnet,
  # so a narrower CIDR would either still cover everyone or exclude
  # legitimate callers unpredictably depending on Docker's own ephemeral
  # IP assignment -- neither is acceptable, and hardcoding a specific
  # ephemeral container IP is explicitly the kind of brittle config this
  # task's own instructions rule out). `internal: true` additionally
  # denies this network any external/gateway routing -- it exists
  # exclusively to carry app<->asterisk AMI traffic, so it never needs
  # one. Distinct, non-overlapping subnet from `mag` (172.28.0.0/16).
  senma-control:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mag-db:
  # TASK-0005: /etc/asterisk is shared read-write with asterisk, read-only
  # with app -- generated once from docker/asterisk-config/ +
  # snep/install/etc/asterisk/snep/ by asterisk-entrypoint.sh, not bind-
  # mounted directly from the source tree (Asterisk needs to own/write its
  # own runtime config; the source tree must not be mutated by container
  # runtime state).
  asterisk-etc:
  mag-asterisk-var:
  mag-asterisk-spool:
  mag-asterisk-log:
  # TASK-0035E10: Fail2ban sqlite + generated ignoreip (not customer PBX data).
  senma-fail2ban-data:
  # TASK-0015: independent from asterisk-etc/mag-asterisk-var -- the
  # provider simulator is a completely separate Asterisk instance with
  # its own config/state, not a second copy of SENMA's own.
  mag-provider-etc:
  mag-provider-var:
