# TASK-0035E10 — SENMA PJSIP unknown-endpoint / scanner filter.
#
# Matches Asterisk 22 res_pjsip distributor NOTICE lines observed live in
# /var/log/asterisk/full on this project, e.g.:
#
#   [Sep 16 21:01:55] NOTICE[83] res_pjsip/pjsip_distributor.c: Request 'REGISTER' from '<sip:1922@asterisk>' failed for '172.28.0.6:43842' (callid: 64f977bd1367c196) - No matching endpoint found
#
# Captures the SIP source IP. Intended for probe/scanner patterns against
# non-existent endpoints — not for a single mistyped extension from a
# known peer (thresholded via jail maxretry).

[Definition]
datepattern = ^\[%%b %%d %%H:%%M:%%S\]
failregex = ^(?:\[\d+\])?\s*NOTICE\[\d+\]\s+res_pjsip/pjsip_distributor\.c:\s+Request '(?:REGISTER|INVITE|OPTIONS|SUBSCRIBE)' from '.*?' failed for '<HOST>(?::\d+)?' \(callid: .*?\) - No matching endpoint found\s*$
ignoreregex =
