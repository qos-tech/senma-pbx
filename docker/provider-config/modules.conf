; modules.conf -- TASK-0015 provider simulator.
;
; Minimal: PJSIP (res_pjsip*/chan_pjsip) autoloads like every other
; module (needed to accept SENMA's trunk registration/calls). Hardware
; technologies this project never uses are noloaded, same as
; docker/asterisk-config/modules.conf. ODBC/CDR-family modules are
; noloaded outright (not just left unconfigured) -- this simulator never
; touches a database and should say so explicitly rather than rely on
; "no config file present -> graceful decline" (TASK-0007) for a role
; that doesn't need them at all.

[modules]
autoload=yes

noload => chan_dahdi.so
noload => chan_alsa.so
noload => chan_oss.so
noload => res_odbc.so
noload => res_odbc_transaction.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
