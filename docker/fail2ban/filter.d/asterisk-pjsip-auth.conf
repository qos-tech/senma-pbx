# TASK-0035E10 — SENMA PJSIP authentication-failure filter.
#
# Matches Asterisk 22 res_pjsip distributor NOTICE lines observed live in
# /var/log/asterisk/full on this project, e.g.:
#
#   [Sep 16 22:43:46] NOTICE[83] res_pjsip/pjsip_distributor.c: Request 'REGISTER' from '<sip:1911@127.0.0.1>' failed for '172.28.0.3:36046' (callid: ca8342f48a2f7002) - Failed to authenticate
#
# Captures the SIP source IP only (not the From-URI host). Does NOT match
# outbound registration failures (res_pjsip_outbound_*), which lack the
# "failed for '<ip>:<port>'" distributor shape.

[Definition]
datepattern = ^\[%%b %%d %%H:%%M:%%S\]
failregex = ^(?:\[\d+\])?\s*NOTICE\[\d+\]\s+res_pjsip/pjsip_distributor\.c:\s+Request '(?:REGISTER|INVITE|OPTIONS|SUBSCRIBE)' from '.*?' failed for '<HOST>(?::\d+)?' \(callid: .*?\) - Failed to authenticate\s*$
ignoreregex = ^.*(outbound_registration|outbound_authenticator).*
