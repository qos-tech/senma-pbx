; manager.conf -- TASK-0005 minimal Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/manager.conf. Differences:
;   - bindaddr: legacy used [::] (IPv6-any); this container network is
;     IPv4-only Docker bridge, kept as 0.0.0.0 for clarity. This binds
;     every interface the container has (both the shared `mag` network
;     and the dedicated `senma-control` network below) -- narrowing WHO
;     may actually use that listener is the ACL's job, not the bind
;     address's (see TASK-0034F PHASE 12/BIND-ADDRESS SCOPE).
;   - permit: legacy hardcoded 172.17.0.0/255.255.0.0 (Docker's *default*
;     bridge subnet) with no evidence it was ever verified against a real
;     deployment.
;     TASK-0034F (closing TASK-0034 CH-6): this ACL previously targeted
;     the shared `mag` network (172.28.0.0/16) -- live-proven during that
;     task to also authenticate `db` and the dev/test-only `provider`
;     fixture, neither of which is a legitimate AMI caller, purely
;     because every service on this project shares that one broad
;     subnet. `__AMI_ACL_SUBNET__` now targets `senma-control`
;     (compose.yaml), a dedicated, `internal: true` network joined ONLY
;     by `app` and `asterisk` -- narrower than `mag` by construction, not
;     merely by convention. See docs/tasks/
;     0034f-production-ami-acl-scoping.md for the full evidence
;     (caller inventory, live positive/negative proof, DB/provider
;     isolation proof).
;   - secret/username: templated at container start from environment by
;     asterisk-entrypoint.sh (see AMI_USER/AMI_PASSWORD in .env), not
;     hardcoded "sneppass" as the legacy file had it.
;   - webenabled removed: SENMA's AMI client (Asterisk_AMI) connects over
;     raw TCP (fsockopen), never AMI-over-HTTP -- webenabled requires
;     http.conf, which is out of this task's minimal scope.
; See docs/tasks/0005-asterisk-container-bootstrap.md and docs/tasks/
; 0034f-production-ami-acl-scoping.md.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[__AMI_USER__]
secret = __AMI_PASSWORD__
deny=0.0.0.0/0.0.0.0
permit=__AMI_ACL_SUBNET__
writetimeout = 100
read = system,call,log,verbose,command,agent,user,config,originate
write = system,call,log,verbose,command,agent,user,config,originate
displayconnects = no
