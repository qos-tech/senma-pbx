; extensions.conf -- TASK-0015 provider simulator.
;
; Deliberately trivial: this container proves real SIP signaling
; (INVITE received, call answered, established briefly, hung up
; cleanly), not any application logic. No AGI, no database -- SENMA's
; own AGI/rule engine is what's under test on the SENMA side; this side
; only needs to behave like a real, if extremely simple, provider
; switch. See docs/tasks/0015-pjsip-trunk-provisioning.md.

[from-senma]
; TASK-0015's one deterministic test destination -- never PSTN, never a
; real number. 600 is chosen as a clearly-reserved/non-production value,
; distinct from any real SENMA extension range.
exten => 600,1,NoOp(TASK-0015 provider simulator received a call for 600)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()
