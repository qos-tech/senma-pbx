; pjsip.conf -- TASK-0015 provider simulator.
;
; A minimal, static PJSIP account representing the "trunk provider" side
; of the test: it accepts an outbound REGISTER from SENMA's own trunk
; (the register-based model TASK-0014 §17/§20 recommended as the first
; outbound milestone) and accepts calls placed through that registration.
; Templated from TRUNK_TEST_USERNAME/TRUNK_TEST_SECRET (.env, same
; env-var-credential pattern as TASK-0009's PJSIP_TEST_1000_SECRET) --
; never a real commercial provider's credentials. See
; docs/tasks/0015-pjsip-trunk-provisioning.md.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Account name is independent of SENMA's own internal trunk-<id> object
; naming (TASK-0014 §10) -- exactly as in real life, where a carrier
; assigns its own account identifier, unrelated to how the PBX names its
; own local trunk objects.
[__TRUNK_TEST_USERNAME__]
type=endpoint
context=from-senma
disallow=all
allow=ulaw,alaw
auth=__TRUNK_TEST_USERNAME__
aors=__TRUNK_TEST_USERNAME__

[__TRUNK_TEST_USERNAME__]
type=auth
auth_type=userpass
username=__TRUNK_TEST_USERNAME__
password=__TRUNK_TEST_SECRET__

; Dynamic AOR: SENMA's outbound REGISTER populates this via
; res_pjsip_registrar, exactly like TASK-0009/0011's extension AORs. AOR
; name MUST equal the endpoint name -- same registrar constraint proven
; in TASK-0009 (see docs/tasks/0010-pjsip-extension-provisioning-architecture.md §6).
[__TRUNK_TEST_USERNAME__]
type=aor
max_contacts=1
remove_existing=yes

; Found live, empirically, during TASK-0015's first real call attempt:
; identify_by=username,ip (the endpoint's default) does NOT match a
; dynamically-registered contact's IP -- that "ip" method only matches a
; statically-configured `identify` object's own match= list, unrelated to
; the registrar. Without one, an outbound-initiated INVITE from SENMA
; (dialing a number, not registering) can't be identified as coming from
; "senma-outbound" at all: it doesn't carry that username on the
; Request-URI, and there's no Authorization header yet on the first,
; unauthenticated attempt. Asterisk correctly falls through to
; "No matching endpoint found" and issues a decoy/anti-scan 401 that no
; real credentials can ever satisfy (a legitimate Asterisk security
; feature, not a bug) -- reproduced live as a real INVITE/401/401 loop
; ending in PJSIP_EFAILEDCREDENTIAL. This `identify` object is what a
; real ITSP's own platform configuration provides for any registered
; customer (recognizing calls from your registered account) -- it
; belongs entirely to this static provider-simulator config, not to
; SENMA's own generator/inbound handling (TASK-0016's actual subject).
; 172.28.0.0/16 is the "mag" network's own pinned subnet (compose.yaml,
; TASK-0005) -- the same value already used for the AMI ACL, not a new
; credential or a guess. See docs/tasks/0015-pjsip-trunk-provisioning.md.
[__TRUNK_TEST_USERNAME__]
type=identify
endpoint=__TRUNK_TEST_USERNAME__
match=172.28.0.0/16

; TASK-0016: the reverse direction -- lets THIS simulator originate a
; real INVITE toward SENMA, to prove inbound trunk routing. A real ITSP's
; own switch doesn't authenticate to itself, so this mirrors SENMA's own
; trunk-<id> endpoint (which likewise emits no inbound auth=, only
; outbound_auth=, docs/tasks/0016-pjsip-inbound-trunk-routing.md §6): no
; auth object, no secret. "asterisk" is SENMA's service's stable
; Docker-DNS name on this same "mag" network (compose.yaml) -- static,
; not a guess. context= is irrelevant for a purely-originating endpoint
; (nothing is ever received back through it in this test), reused from
; the account above rather than inventing a second one.
[to-senma]
type=endpoint
context=from-senma
disallow=all
allow=ulaw,alaw
aors=to-senma

[to-senma]
type=aor
contact=sip:asterisk:5060
