# TASK-0035E2 — Pilot Compose overlay (content-equivalent to compose.host.yaml).
#
# Kept as the stable `make pilot-up` / `-f compose.pilot.yaml` path.
# Edit compose.host.yaml and re-sync this file when changing host networking.

# TASK-0035E2 — Host-networking pilot/production overlay.
#
# Model B (documented in
# docs/tasks/0035e2-host-networking-architecture-local-service-binding.md):
#
#   * compose.yaml          — Docker bridge + service DNS (dev / regression)
#   * compose.host.yaml     — Linux host networking for app/asterisk/db
#                             (pilot / production on a dedicated PBX host)
#
# Usage:
#   docker compose -f compose.yaml -f compose.host.yaml up -d app asterisk db
#   make pilot-up   # wraps the same two-file invocation
#
# Core services share the host network namespace. Sensitive listeners bind
# loopback only (DB :3306, AMI :5038, Asterisk HTTP/WS :8088). SIP/RTP and
# the Apache HTTP backend bind on the host as configured by entrypoints /
# env (default HTTP :8080).
#
# TASK-0035E10: senma-security MUST also be network_mode: host in pilot /
# production (declared in compose.yaml and re-asserted below). Fail2ban
# must manipulate the same host INPUT path that receives SIP 5060.
# DOCKER-USER does not apply to host-networked SIP.
#
# Requires native Linux. Docker Desktop (macOS/Windows) is NOT equivalent.
# Development/regression continues to use plain compose.yaml (bridge).
#
# Replaces the TASK-0034B port-publishing role of compose.pilot.yaml for
# new pilots: with host networking, Docker `ports:` maps are unnecessary
# and misleading.

services:
  app:
    network_mode: host
    ports: !reset []
    networks: !reset
    environment:
      SENMA_NETWORK_MODE: host
      TLS_TERMINATION_MODE: ${TLS_TERMINATION_MODE:-external}
      DB_HOST: 127.0.0.1
      ASTERISK_HOST: 127.0.0.1
      ASTERISK_AMI_ACL_SUBNET: 127.0.0.1/32
      ASTERISK_HTTP_BIND: 127.0.0.1
      ASTERISK_AMI_BIND: 127.0.0.1
      APACHE_HTTP_PORT: ${MAG_HTTP_PORT:-8080}
      ASTERISK_WS_BACKEND: ws://127.0.0.1:8088/ws
      APP_HEALTHCHECK_URL: http://127.0.0.1:${MAG_HTTP_PORT:-8080}/
      # Optional NAT overrides for PJSIP transports (empty = leave DB as-is).
      PJSIP_EXTERNAL_SIGNALING_ADDRESS: ${PJSIP_EXTERNAL_SIGNALING_ADDRESS:-}
      PJSIP_EXTERNAL_MEDIA_ADDRESS: ${PJSIP_EXTERNAL_MEDIA_ADDRESS:-}
      PJSIP_LOCAL_NET: ${PJSIP_LOCAL_NET:-}

  asterisk:
    network_mode: host
    ports: !reset []
    networks: !reset
    environment:
      SENMA_NETWORK_MODE: host
      DB_HOST: 127.0.0.1
      # Healthcheck AMI self-check resolves ASTERISK_HOST; loopback in host mode.
      ASTERISK_HOST: 127.0.0.1
      ASTERISK_AMI_ACL_SUBNET: 127.0.0.1/32
      ASTERISK_HTTP_BIND: 127.0.0.1
      ASTERISK_AMI_BIND: 127.0.0.1
      PJSIP_EXTERNAL_SIGNALING_ADDRESS: ${PJSIP_EXTERNAL_SIGNALING_ADDRESS:-}
      PJSIP_EXTERNAL_MEDIA_ADDRESS: ${PJSIP_EXTERNAL_MEDIA_ADDRESS:-}
      PJSIP_LOCAL_NET: ${PJSIP_LOCAL_NET:-}

  db:
    network_mode: host
    ports: !reset []
    networks: !reset
    volumes:
      # Loopback-only MariaDB bind for host networking. Without this the
      # stock mariadb image listens on 0.0.0.0:3306 on the shared host
      # namespace — a security failure for pilot/production.
      - ./docker/mariadb-host.cnf:/etc/mysql/conf.d/zz-senma-host-bind.cnf:ro

  # TASK-0035E10 — re-assert host networking for SIP abuse protection.
  # Base compose.yaml already sets network_mode: host; this overlay makes
  # the pilot/production contract explicit and merge-visible.
  senma-security:
    network_mode: host
