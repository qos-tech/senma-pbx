; TASK-0009: snep.php (php-cgi) and several other AGI entrypoints parse
; their own argv (Zend_Console_Getopt) to read the -x/-o/-v flags Asterisk's
; dialplan passes them. The CGI SAPI (unlike CLI, which always forces this
; On) honors register_argc_argv from php.ini and defaults it Off -- without
; this, Zend_Console_Getopt::parse() throws immediately ("argv is not
; available, because ini option 'register_argc_argv' is set Off"), caught
; by snep.php's own catch block, which logs and exits before the dialplan
; rule engine ever runs (confirmed via a live call during TASK-0009
; validation: AGI exited cleanly/rc=0, but never dialed). See
; docs/tasks/0009-first-pjsip-call.md.
register_argc_argv = On
