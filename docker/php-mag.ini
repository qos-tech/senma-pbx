; The legacy ZF1 code under snep/lib/Zend emits PHP 8 E_DEPRECATED notices
; (e.g. Iterator/Countable return-type mismatches) during bootstrap, before
; the app's own index.php narrows error_reporting. With display_errors On,
; those notices are echoed directly into the HTTP response body ahead of the
; app's own output, which breaks any later header()-based redirect ("headers
; already sent") -- a behavior change from the original PHP 5.x deployment,
; not a modernization choice. Logging instead of displaying restores the
; original behavior and keeps errors visible via `make logs`.
; See docs/tasks/0001-docker-bootstrap.md.
display_errors = Off
log_errors = On
error_log = /dev/stderr
