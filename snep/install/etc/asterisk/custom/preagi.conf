; Arquivo posagi.conf, arquivo para customização de funcionamento da central
; Snep PBX usando linguagem de dialplan do Asterisk. Este arquivo é inserido
; logo ANTES da execução do controle de ligação pelo Agi SNEP.

; TASK-0028C: this shipped example targeted SIP/1003, a technology this
; runtime no longer loads. Fixing the [default]/[hints] context-bleed bug
; elsewhere in extensions.conf makes extension 1234 (previously orphaned
; under the unreachable [hints] context) reachable for the first time --
; leaving a guaranteed-broken Dial(SIP/...) here would turn a merely
; inert legacy string into a live, reachable failure. Token updated to
; the PJSIP-native equivalent (same extension number convention as every
; other SENMA-provisioned PJSIP endpoint); everything else about this
; customer-editable file is unchanged. See
; docs/tasks/0028c-pjsip-legacy-runtime-closure.md.
exten => 1234,1,Noop(Saida manual)
exten => 1234,n,Dial(PJSIP/1003,60,twg)
exten => 1234,n,Hangup
