<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/snep

    <Directory /var/www/html/snep>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mag-error.log
    CustomLog ${APACHE_LOG_DIR}/mag-access.log combined
</VirtualHost>
