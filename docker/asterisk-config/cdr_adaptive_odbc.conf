; cdr_adaptive_odbc.conf -- TASK-0007 CDR backend.
;
; No legacy equivalent -- SNEP 3.07 used cdr_odbc, not cdr_adaptive_odbc
; (see snep/install/etc/asterisk/cdr_odbc.conf). This project deliberately
; chose the modern module instead: Asterisk's own module metadata marks
; cdr_adaptive_odbc "core" support tier versus cdr_odbc's "extended" tier,
; and unlike cdr_odbc it can pick up future custom CDR columns without an
; Asterisk-side change. See docs/tasks/0007-asterisk22-odbc-investigation.md §7.
;
; "snep" is the connection name defined in res_odbc.conf's [snep] DSN
; section. cdr_odbc.so stays noloaded in modules.conf -- never both CDR
; backends active at once.
;
; TASK-0009 correction: TASK-0007 assumed (untested -- no channel existed
; yet to write a real CDR) that `cdr`'s columns matched Asterisk's
; standard CDR field names exactly, needing no aliasing. A real call
; proved that wrong for exactly one column: cdr_adaptive_odbc
; auto-discovers DB columns and, for dates, only recognizes CDR fields
; literally named "start"/"answer"/"end" (cdr_adaptive_odbc.c) -- our
; table's date column is named `calldate` (the cdr_odbc-era convention),
; which isn't one of those names and isn't a real CDR variable either, so
; cdr_adaptive_odbc silently dropped it from every INSERT. MariaDB then
; silently filled the NOT NULL column from its own
; DEFAULT '0000-00-00 00:00:00' -- every CDR row was getting a zero
; calldate despite disposition/duration/billsec/src/dst all being correct.
; The `alias` directive maps the standard field to our actual column name.
[snep]
connection=snep
table=cdr
alias start => calldate
