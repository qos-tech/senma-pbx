; logger.conf -- TASK-0005 minimal Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/logger.conf (which was itself
; Asterisk's stock sample, not SNEP-customized). Kept minimal: a single
; full log to astlogdir (/var/log/asterisk/full), matching what
; `make logs`-style container log inspection and the health check both
; expect to be able to read. See
; docs/tasks/0005-asterisk-container-bootstrap.md.

[general]

