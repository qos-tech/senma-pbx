; http.conf -- static, project-owned Asterisk built-in HTTP/WebSocket
; server configuration (TASK-0028Z).
;
; Before this file existed, /etc/asterisk/http.conf was entirely absent
; and Asterisk's built-in HTTP server defaulted to fully disabled
; ("asterisk -rx 'http show status'" => "Server Disabled"). The product's
; pjsip_transports "wss" row (protocol=wss, bind=0.0.0.0:8089, seeded by
; TASK-0018) rides on top of this same server via
; res_http_websocket.so/res_pjsip_transport_websocket.so -- both modules
; were already loaded and running, but with no listening socket behind
; them a WSS client had nothing to connect to at all. See
; docs/tasks/0028z-wss-asterisk-http-enablement.md.
;
; TERMINATION MODEL (TASK-0028Z architecture decision): TLS terminates
; directly in Asterisk. No reverse proxy exists anywhere in this
; project's Docker topology (compose.yaml has no such service, and
; introducing one is explicitly out of this task's scope), and silently
; downgrading a user-selected "wss" transport to plain "ws" at the
; platform layer would break the product's own security contract without
; the user ever choosing that. tlsbindaddr below (0.0.0.0:8089) matches
; the already-seeded pjsip_transports "wss" row's own bind address/port
; exactly on purpose.
;
; tlscertfile/tlsprivatekey point at a self-signed TEST-ONLY certificate
; generated once, at container first boot, by
; docker/asterisk-entrypoint.sh -- never committed to git, never baked
; into the image. Full certificate lifecycle management (customer-
; supplied certificates, CA configuration, rotation, an upload UI) is
; explicitly reserved for TASK-0029A; this file only proves the
; platform/runtime WSS path itself is operational.

[general]
enabled=yes
; Asterisk's [general] enabled switch is the single master switch for
; the whole built-in HTTP server -- it cannot turn on the TLS/WSS
; listener below without also activating this plain listener, but
; nothing in the current product exposes or needs a plain "ws" transport
; externally (only "wss" is seeded/supported; see pjsip_transports).
; Bound to loopback-only rather than left at Asterisk's own 0.0.0.0
; default, so it is reachable from nowhere outside this container.
bindaddr=127.0.0.1
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/wss-test-cert.pem
tlsprivatekey=/etc/asterisk/keys/wss-test-key.pem
