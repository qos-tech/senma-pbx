; TASK-0009: snep.php (php-cgi) and several other AGI entrypoints parse
; their own argv (Zend_Console_Getopt) to read the -x/-o/-v flags Asterisk's
; dialplan passes them. The CGI SAPI (unlike CLI, which always forces this
; On) honors register_argc_argv from php.ini and defaults it Off -- without
; this, Zend_Console_Getopt::parse() throws immediately ("argv is not
; available, because ini option 'register_argc_argv' is set Off"), caught
; by snep.php's own catch block, which logs and exits before the dialplan
; rule engine ever runs (confirmed via a live call during TASK-0009
; validation: AGI exited cleanly/rc=0, but never dialed). See
; docs/tasks/0009-first-pjsip-call.md.
register_argc_argv = On

; TASK-0011: STDOUT is the AGI protocol channel back to Asterisk -- any
; PHP notice/warning/deprecation written there (display_errors=On, which
; snep.php/agi_base.php set explicitly, and ini_set() always overrides
; whatever this file says) gets misread by Asterisk as a malformed AGI
; command, corrupting the *next* real command too (reproduced live: a
; PHP 8.4 "Creation of dynamic property" deprecation corrupted the
; following "GET VARIABLE DIALSTATUS" read, making an actually-answered
; call misread as unanswered). snep.php/agi_base.php now set
; display_errors=0 directly (ini_set() must win over this file either
; way); log_errors/error_log here restore the lost diagnostic visibility
; via the log instead -- same display_errors=Off + log_errors=On pattern
; docker/php-mag.ini already uses for the web app. See
; docs/tasks/0011-pjsip-extension-provisioning.md.
log_errors = On
error_log = /dev/stderr
