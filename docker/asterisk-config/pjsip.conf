; pjsip.conf -- static, project-owned PJSIP configuration.
;
; TASK-0018: the static [transport-udp] stanza that used to live here
; directly is gone. Every PJSIP extension/trunk that existed before this
; task implicitly depended on that one hardcoded transport; it is now a
; SENMA-managed, UI-editable pjsip_transports row (seeded byte-identical:
; protocol=udp, bind=0.0.0.0:5060, is_default=true), generated by
; Snep_PjsipTransportConf into snep/senma-pjsip-transports.conf and
; included first below. This file now holds only include structure --
; no static transport, no static endpoint -- matching TASK-0011's own
; "production provisioning must not depend on anything defined in a
; static file" principle, extended to transports. See
; docs/tasks/0017-pjsip-transports-and-templates-architecture.md §4/§5
; and docs/tasks/0018-pjsip-transports.md.

#include snep/senma-pjsip-transports.conf
#include snep/senma-pjsip.conf
; TASK-0015: SENMA-generated PJSIP trunk provisioning
; (Snep_PjsipTrunkConf::loadConfFromDb()) -- a separate generated file
; from senma-pjsip.conf above, per docs/tasks/0014-pjsip-trunk-provisioning-architecture.md
; §9/§11 (extensions and trunks have materially different object counts/
; lifecycle, so a dedicated generator writes its own file rather than
; sharing one with Snep_PjsipConf).
#include snep/senma-pjsip-trunks.conf
