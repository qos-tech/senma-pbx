; musiconhold.conf -- TASK-0034I minimal Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/musiconhold.conf (SNEP 3.07
; legacy install) -- this file's only job is the #include below. This
; file itself was never deployed by the Docker asterisk-entrypoint.sh
; bootstrap (it was not among docker/asterisk-config/*.conf), so the
; #include never fired: `moh show classes` returned empty and Asterisk
; logged "No music on hold classes configured, disabling music on hold."
; on every boot, even though /etc/asterisk/snep/snep-musiconhold.conf
; (the actual SNEP-managed class list, MusicOnHoldController-writable)
; was present and correct the whole time. See
; docs/tasks/0034i-system-status-dependency-runtime-resource-closure.md.
;
; Do not add classes directly here -- SNEP/SENMA owns the [default] (and
; any admin-added) class list exclusively through snep-musiconhold.conf
; (Snep_SoundFiles_Manager::addClass()/removeClass()), matching the
; identical include pattern already used for every other snep-*.conf.
#include /etc/asterisk/snep/snep-musiconhold.conf
