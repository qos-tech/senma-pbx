; extconfig.conf -- TASK-0007 minimal realtime configuration.
;
; Adapted from snep/install/etc/asterisk/extconfig.conf. Deliberately
; narrower than the legacy file: only `queues`/`queue_members`, the two
; families TASK-0007's investigation confirmed are (a) actively written
; today by SENMA's own web UI (QueuesController/Snep_Queues_Manager) and
; (b) already schema-compatible with Asterisk 22's realtime column names
; with no changes -- see the compatibility matrix in
; docs/tasks/0007-asterisk22-odbc-investigation.md.
;
; Deliberately NOT included, each for a distinct documented reason (see
; the same doc):
;   - queue_log: matching table exists, but zero first-party PHP code
;     reads or writes it -- no current consumer.
;   - voicemail: SENMA already writes voicemail_users directly via
;     Zend_Db, independent of Asterisk; the realtime *read* side can't be
;     exercised without a working SIP channel (Phase 6), so wiring it now
;     would be untestable.
;   - sipusers/sippeers/iaxusers/iaxpeers/meetme: already commented out in
;     the legacy file; map to chan_sip (removed in Asterisk 21+) or will
;     be superseded entirely by PJSIP realtime tables in Phase 6.
;
; "snep" is the connection name defined in res_odbc.conf's [snep] DSN
; section -- table names match SENMA's existing schema exactly, no
; aliasing needed.

[settings]
queues => odbc,snep,queues
queue_members => odbc,snep,queue_members
