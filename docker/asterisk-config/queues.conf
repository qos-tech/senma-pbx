; queues.conf -- TASK-0034I-R4 minimal base for app_queue.
;
; Asterisk's app_queue refuses to load when this file is absent
; ("No call queueing config file (queues.conf), so no call queues" /
; "app_queue declined to load"). An empty file is sufficient for the
; module to reach Running (proven live); this file carries only the
; historical SNEP [general] defaults so Realtime-backed queues inherit
; the same global behavior the legacy install used.
;
; Queue definitions are NOT stored here. Canonical source of truth is
; Asterisk Realtime via extconfig.conf:
;   queues         => odbc,snep,queues
;   queue_members  => odbc,snep,queue_members
; See docs/tasks/0007-asterisk22-odbc-investigation.md and
; docs/tasks/0034i-r4-queue-runtime-initialization-ami-hardening.md.
;
; Do not add static queue stanzas to this file.

[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
keepstats = yes
eventwhencalled = yes
