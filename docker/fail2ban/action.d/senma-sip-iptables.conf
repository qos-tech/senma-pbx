# TASK-0035E10 — SIP-only iptables ban action (no multiport module).
#
# This host/kernel rejects xt_multiport ("Extension multiport revision 0
# not supported"). Use plain -p tcp/udp --dport 5060 instead.
# Includes stock iptables.conf so <iptables> / <blocktype> tags resolve.
#
# Scope: SIP 5060 tcp+udp only. Never flushes INPUT. Never touches RTP.

[INCLUDES]
before = iptables.conf

[Definition]
# Override stock multiport helpers with single-port tcp+udp jumps.
_ipt_chain_rule = -p $proto -m $proto --dport <port> <rule-jump>
_ipt_check_rule = <iptables> -C $chain %(_ipt_chain_rule)s

type = multiport

[Init]
port = 5060
protocol = tcp,udp
chain = INPUT
blocktype = REJECT --reject-with icmp-port-unreachable
returntype = RETURN
