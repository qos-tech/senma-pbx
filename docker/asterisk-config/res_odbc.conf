; res_odbc.conf -- TASK-0007 minimal ODBC integration.
;
; Adapted from snep/install/etc/asterisk/res_odbc.conf. Differences:
;   - dsn: points at the "snep" DSN defined in /etc/odbc.ini (generated by
;     asterisk-entrypoint.sh from DB_HOST/DB_NAME -- see that script),
;     which in turn references the "MariaDB Unicode" driver already
;     registered in /etc/odbcinst.ini by the odbc-mariadb package at
;     image-build time. No architecture-specific driver path is
;     referenced anywhere in this stack.
;   - username/password: templated at container start from the same
;     DB_USER/DB_PASSWORD env vars the app container's own DB connection
;     already uses (docker/entrypoint.sh) -- one source of truth, not a
;     second hand-copied credential pair.
; See docs/tasks/0007-asterisk22-odbc-investigation.md.

[snep]
enabled => yes
dsn => snep
pre-connect => yes
username => __DB_USER__
password => __DB_PASSWORD__
