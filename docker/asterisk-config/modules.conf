; modules.conf -- TASK-0005/TASK-0007 Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/modules.conf. Differences from
; the legacy file:
;   - No `preload => res_odbc.so` / `preload => res_config_odbc.so`.
;     TASK-0007's investigation proved these were never necessary: a real
;     boot with plain `autoload=yes` resolves the res_odbc/
;     res_odbc_transaction load order correctly on its own (the apparent
;     circular-dependency failure in TASK-0005/early TASK-0007 was an
;     artifact of manual, one-at-a-time `module load` CLI testing, not a
;     real defect -- see docs/tasks/0007-asterisk22-odbc-investigation.md).
;   - res_odbc.so/res_config_odbc.so: TASK-0005 noloaded these pending
;     TASK-0007's investigation; now enabled, with res_odbc.conf/
;     extconfig.conf providing real configuration (queues/queue_members
;     realtime only -- see extconfig.conf).
;   - cdr_odbc.so stays noloaded; cdr_adaptive_odbc.so (not noloaded, so
;     autoload=yes picks it up) is the chosen CDR backend instead --
;     TASK-0007 §7: higher upstream support tier ("core" vs "extended"),
;     equally compatible with the existing unmodified `cdr` table schema,
;     better future flexibility. Never both at once.
;   - func_odbc.so, cel_odbc.so: still noloaded. func_odbc is confirmed
;     unused (stock sample only, no SNEP dialplan usage). cel_odbc is
;     confirmed dead -- no `cel` table exists in the schema at all, zero
;     first-party references. Neither is part of this batch's scope.
;   - res_pjsip*/chan_pjsip, chan_dahdi, chan_alsa, chan_oss: not present
;     in this build at all (their dependencies were never installed in
;     docker/asterisk.Dockerfile), so `noload` lines for them are inert
;     documentation of intent, kept for parity with the legacy file and
;     to fail loudly (a "no such module" warning, not a silent gap) if a
;     future image change ever makes them buildable by accident.
;   - cdr_mysql/app_mysql/res_config_mysql: never installed, not present,
;     not restored -- see the TASK-0005 investigation report; these were
;     not actually load-bearing in the legacy install either (confirmed:
;     zero MYSQL() dialplan usage anywhere in first-party code).
;   - Voicemail realtime and SIP/IAX/MeetMe realtime: not configured in
;     extconfig.conf, deliberately -- see docs/tasks/
;     0007-asterisk22-odbc-investigation.md for why each is deferred.

[modules]
autoload=yes

noload => res_pjsip.so
noload => res_pjsip_pubsub.so
noload => res_pjsip_session.so
noload => chan_pjsip.so
noload => res_pjsip_exten_state.so
noload => chan_dahdi.so
noload => chan_alsa.so
noload => chan_oss.so
noload => cdr_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
