; http.conf -- static, project-owned Asterisk built-in HTTP/WebSocket
; server configuration (TASK-0028Z; TLS ownership TASK-0029A;
; reverse-proxy termination model TASK-0035A).
;
; Before TASK-0028Z, /etc/asterisk/http.conf was entirely absent and
; Asterisk's built-in HTTP server defaulted to fully disabled
; ("asterisk -rx 'http show status'" => "Server Disabled"). The product's
; pjsip_transports websocket row rides on top of this same server via
; res_http_websocket.so/res_pjsip_transport_websocket.so. See
; docs/tasks/0028z-wss-asterisk-http-enablement.md.
;
; TERMINATION MODEL (TASK-0035A) -- SUPERSEDES TASK-0028Z for public WSS:
; Public WSS TLS terminates at the SENMA reverse proxy (Apache in the
; `app` container). Asterisk receives private plain WebSocket from that
; proxy over the Docker network:
;
;   Client --wss/trusted TLS--> app:443 /asterisk/ws
;        --ws private-------> asterisk:8088 /ws
;
; Prefer this over proxying to Asterisk WSS (:8089) so public certificate
; lifecycle is owned solely by the reverse proxy and is not coupled to
; Asterisk restarts.
;
; TASK-0029A: Asterisk-side HTTP TLS settings (tlsenable/tlsbindaddr/
; tlscertfile/...) still live in the GENERATED file
; snep/senma-http-tls.conf (Snep_PjsipTransportConf::writeHttpTlsConf())
; when an enabled ws/wss transport row carries certificate material --
; retained for optional direct Asterisk WSS / native experiments, NOT
; required for the supported public WSS path after TASK-0035A. Native
; SIP TLS (protocol=tls) remains a separate certificate lifecycle.
; See docs/tasks/0029a-tls-transport-certificate-management.md and
; docs/tasks/0035a-reverse-proxy-wss-tls-termination-pilot-realignment.md.

[general]
enabled=yes
; Plain HTTP/WS listener for the reverse proxy backend.
; Default bind 0.0.0.0 so the `app` container can reach asterisk:8088
; over the Docker `mag` network (TASK-0035A). TASK-0035E2 host-network
; pilots override to 127.0.0.1 via ASTERISK_HTTP_BIND (asterisk-
; entrypoint.sh rewrites bindaddr every start). This port must NOT be
; published to the host on bridge deployments (compose.yaml deliberately
; omits 8088). On host networking, loopback bind is the exposure
; boundary — prove with `ss -lntp | grep 8088`.
bindaddr=0.0.0.0
bindport=8088

#include snep/senma-http-tls.conf
