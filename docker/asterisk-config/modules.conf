; modules.conf -- TASK-0005 minimal Docker runtime configuration.
;
; Adapted from snep/install/etc/asterisk/modules.conf. This task's scope
; is deliberately reduced to booting Asterisk and exposing AMI/config
; visibility -- not a functional PBX (see
; docs/tasks/0005-asterisk-container-bootstrap.md). Differences from the
; legacy file:
;   - No `preload => res_odbc.so` / `preload => res_config_odbc.so`.
;   - Investigated per this task's instructions: neither target flow
;     needs it -- `queues` reads snep-musiconhold.conf directly from disk
;     via PHP (Zend_Config_Ini), not through Asterisk at all; `systemstatus`
;     only needs AMI. ODBC/realtime (CDR, CEL, voicemail, queue realtime)
;     is real, tracked debt, deliberately deferred whole to TASK-0006, not
;     partially wired here.
;   - res_pjsip*/chan_pjsip, chan_dahdi, chan_alsa, chan_oss: not present
;     in this build at all (their dependencies were never installed in
;     docker/asterisk.Dockerfile), so `noload` lines for them are inert
;     documentation of intent, kept for parity with the legacy file and
;     to fail loudly (a "no such module" warning, not a silent gap) if a
;     future image change ever makes them buildable by accident.
;   - cdr_mysql/app_mysql/res_config_mysql: never installed, not present,
;     not restored -- see the TASK-0005 investigation report; these were
;     not actually load-bearing in the legacy install either (confirmed:
;     zero MYSQL() dialplan usage anywhere in first-party code).

[modules]
autoload=yes

noload => res_pjsip.so
noload => res_pjsip_pubsub.so
noload => res_pjsip_session.so
noload => chan_pjsip.so
noload => res_pjsip_exten_state.so
noload => chan_dahdi.so
noload => chan_alsa.so
noload => chan_oss.so
noload => res_odbc.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cel_odbc.so
