;
; RTP Configuration -- Docker-native Asterisk runtime (TASK-0035C).
;
; TASK-0034B narrowed the pilot RTP range to 10000-10199 and documented
; that range in snep/install/etc/asterisk/rtp.conf, but the Asterisk
; container never deployed that file: docker/asterisk-entrypoint.sh only
; copies docker/asterisk-config/*.conf (plus dialplan) into the named
; volume. Live evidence before this file: `rtp show settings` reported
; Asterisk defaults Port start 5000 / Port end 31000 while
; compose.pilot.yaml published only 10000-10199/udp -- a silent mismatch
; that would break host-published media for any negotiated port outside
; the published window.
;
; Keep this file's rtpstart/rtpend in sync with compose.pilot.yaml.
; Do NOT widen either side independently.
;
[general]
rtpstart=10000
rtpend=10199

; Global STUN remains intentionally disabled. WebRTC ICE is enabled per
; endpoint via webrtc=yes (TASK-0035B). Public/media addressing for
; internet clients is an operator transport NAT contract
; (external_media_address / local_net) -- see TASK-0035C. Do not enable
; a public STUN server here without evidence.
;icesupport=yes
;stunaddr=
